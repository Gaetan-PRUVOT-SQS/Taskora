# Ne transmettre que l'Upgrade WebSocket. Recopier $http_upgrade tel quel
# laisserait un client demander h2c et parler au backend derrière ce proxy.
map $http_upgrade $ws_upgrade {
  "~*^websocket$" websocket;
  default "";
}
map $http_upgrade $ws_connection {
  "~*^websocket$" upgrade;
  default close;
}

# HSTS seulement sur une connexion que nginx sert lui-même en TLS. Si le TLS
# se termine sur un proxy placé devant, c'est ce proxy qui doit l'envoyer.
map $https $hsts_header {
  on "max-age=31536000; includeSubDomains";
  default "";
}

server {
  # port non privilégié, nginx ne tourne pas en root
  listen 8080;
  server_tokens off;
  root /usr/share/nginx/html;
  index index.html;

  # Le build Vite ne contient ni script ni style en ligne : tout vient de
  # 'self'. Les images de pièces jointes passent par des URL blob:.
  add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' blob: data:; font-src 'self'; connect-src 'self'; worker-src 'self'; manifest-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header Referrer-Policy "no-referrer" always;
  add_header Strict-Transport-Security $hsts_header always;

  # Host de la requête sans le port. L'API ne le lit nulle part : origines
  # de confiance et redirect_uri viennent de BACKEND_URL (SEC-CK-15,
  # SEC-OAUTH-09 et 10), d'où le nosemgrep sur les deux lignes Host.
  location /api/ {
    proxy_pass http://backend:3001/api/;
    proxy_http_version 1.1;
    proxy_set_header Host $host; # nosemgrep: generic.nginx.security.request-host-used.request-host-used
  }

  location /ws {
    proxy_pass http://backend:3001/ws;
    # semgrep signale tout Upgrade transmis ; ici seul "websocket" passe par
    # les map ci-dessus, la correction que la règle recommande
    proxy_http_version 1.1; # nosemgrep: generic.nginx.security.possible-h2c-smuggling.possible-nginx-h2c-smuggling
    proxy_set_header Upgrade $ws_upgrade;
    proxy_set_header Connection $ws_connection;
    proxy_set_header Host $host; # nosemgrep: generic.nginx.security.request-host-used.request-host-used
  }

  location / {
    try_files $uri /index.html;
  }
}
