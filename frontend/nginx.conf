# Only forward a WebSocket upgrade. Passing $http_upgrade as is would also let
# a client ask for h2c and talk to the backend past this proxy.
map $http_upgrade $ws_upgrade {
  "~*^websocket$" websocket;
  default "";
}
map $http_upgrade $ws_connection {
  "~*^websocket$" upgrade;
  default close;
}

server {
  # unprivileged port, nginx runs without root
  listen 8080;
  root /usr/share/nginx/html;
  index index.html;

  location /api/ {
    proxy_pass http://backend:3001/api/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
  }

  location /ws {
    proxy_pass http://backend:3001/ws;
    # Semgrep flags any forwarded Upgrade. Only "websocket" gets through the maps above, which is
    # the fix the rule recommends, so this one is reviewed and accepted.
    proxy_http_version 1.1; # nosemgrep: generic.nginx.security.possible-h2c-smuggling.possible-nginx-h2c-smuggling
    proxy_set_header Upgrade $ws_upgrade;
    proxy_set_header Connection $ws_connection;
    proxy_set_header Host $host;
  }

  location / {
    try_files $uri /index.html;
  }
}
