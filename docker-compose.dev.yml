# Local development only: publishes Postgres on 127.0.0.1:5432 for psql or a backend run outside Docker.
#   docker compose -f docker-compose.yml -f docker-compose.dev.yml up -d postgres
# Never use this file on a server. The base docker-compose.yml does not publish the database.
services:
  postgres:
    ports:
      - "127.0.0.1:5432:5432"
