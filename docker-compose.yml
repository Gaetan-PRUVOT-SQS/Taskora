services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: taskora
      POSTGRES_PASSWORD: taskora
      POSTGRES_DB: taskora
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U taskora -d taskora"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  backend:
    build: ./backend
    ports:
      - "3001:3001"
    environment:
      # obligatoire, lu depuis .env (voir .env.example)
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET must be set in .env, see .env.example}
      DATABASE_URL: postgresql://taskora:taskora@postgres:5432/taskora
      UPLOAD_DIR: /data/uploads
      PORT: 3001
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:8080}
      BACKEND_URL: ${BACKEND_URL:-http://localhost:8080}
      RATE_LIMIT_MAX: "300"
      AUTH_RATE_LIMIT_MAX: "30"
    volumes:
      - board_data:/data
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3001/api/health').then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s
    restart: unless-stopped

  frontend:
    build: ./frontend
    ports:
      - "8080:80"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

volumes:
  pgdata:
  board_data:
