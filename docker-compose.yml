services:
  postgres:
    # pinned by digest and kept up to date by Dependabot (docker-compose ecosystem).
    # The CI service in .github/workflows/test-pipeline.yml and scripts/test-db.sh use the same
    # reference, the policy job of the pipeline fails when they differ.
    image: postgres:16-alpine@sha256:721873c34ceb9f8d8fc265984940dc982404c105f19ad51be9fdc5970a6080ea
    environment:
      POSTGRES_USER: taskora
      # required, no default: run scripts/init-env.sh once, it writes a random one in .env
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in .env, run scripts/init-env.sh}
      POSTGRES_DB: taskora
    # the database is not published: only the backend reaches it, on the compose network.
    # For local tools, docker-compose.dev.yml publishes it on 127.0.0.1 only.
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U taskora -d taskora"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    ports:
      - "127.0.0.1:3001:3001"
    environment:
      # obligatoire, lu depuis .env (voir .env.example)
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET must be set in .env, see .env.example}
      # adresse publique en https (redirect_uri OAuth, origine de confiance)
      BACKEND_URL: ${BACKEND_URL:?BACKEND_URL must be set in .env, see .env.example}
      # built from the same variable; scripts/init-env.sh generates hex, so no URL escaping is needed
      DATABASE_URL: "postgresql://taskora:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in .env, run scripts/init-env.sh}@postgres:5432/taskora"
      UPLOAD_DIR: /data/uploads
      PORT: 3001
      HOST: 0.0.0.0
      CORS_ORIGIN: "*"
      RATE_LIMIT_MAX: "300"
      AUTH_RATE_LIMIT_MAX: "30"
    volumes:
      - board_data:/data
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build: ./frontend
    ports:
      - "127.0.0.1:8080:8080"
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    depends_on:
      - backend

volumes:
  pgdata:
  board_data:
