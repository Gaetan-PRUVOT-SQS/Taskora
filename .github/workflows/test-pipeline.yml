# Same stages as scripts/test-pipeline.sh: lint, unit, functional (API + UI + Cypress),
# full regression with coverage, then coverage of the changed lines (diff-cover).
name: test-pipeline
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
concurrency:
  group: test-pipeline-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
env:
  COVERAGE_MIN: "80"
  FLAKY_RERUNS: "2"
  BASE_REF: origin/${{ github.base_ref || 'main' }}
  # the API, functional and E2E tests run against this Postgres service
  TEST_DATABASE_URL: postgresql://taskora:taskora@127.0.0.1:5432/taskora
jobs:
  pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    services:
      postgres:
        image: postgres:16-alpine@sha256:721873c34ceb9f8d8fc265984940dc982404c105f19ad51be9fdc5970a6080ea
        env:
          POSTGRES_USER: taskora
          POSTGRES_PASSWORD: taskora
          POSTGRES_DB: taskora
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U taskora -d taskora"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # full history for diff-cover against BASE_REF
          # no token left in .git/config for the later steps
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Cypress binary
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/Cypress
          key: cypress-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      - run: npx cypress install && npx cypress verify
      - name: Chromium for the Playwright DnD check
        run: npx --workspace=e2e playwright install --with-deps chromium
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - run: pip install diff-cover

      # exit codes: 10 lint, 20 unit, 30 functional, 40 regression, 50 coverage, 60 flaky
      - name: Lint
        run: scripts/test-pipeline.sh lint
      - name: Unit tests
        run: scripts/test-pipeline.sh unit
      - name: Functional and E2E tests
        run: scripts/test-pipeline.sh functional
      - name: Full regression and changed-code coverage
        run: scripts/test-pipeline.sh regression
      - name: Frontend build
        run: npm run build

      - if: always()
        name: Publish summary
        run: cat test-results/pipeline-summary.md >> "$GITHUB_STEP_SUMMARY" || true
      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-results
          path: test-results/
          if-no-files-found: ignore
