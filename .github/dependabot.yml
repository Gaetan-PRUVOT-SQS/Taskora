# Keeps the SHA pins, the hashed Python tool locks, the npm lockfiles and the base images up to date.
# backend/ and frontend/ have their own lockfile because their Dockerfiles run npm ci there.
# The cooldown leaves a few days for a bad release to be noticed before it is proposed.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      actions:
        patterns: ["*"]
  - package-ecosystem: pip
    directory: /.github/requirements
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
  - package-ecosystem: npm
    directories: ["/", "/backend", "/frontend"]
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
      semver-major-days: 30
    open-pull-requests-limit: 10
  - package-ecosystem: docker
    directories: ["/backend", "/frontend"]
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
